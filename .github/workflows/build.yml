name: AndroidEmu iOS 16.4

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IOS_VERSION: "16.4"
  KERNARIUM_COMMIT: "2c49df8ccb7b138400548ccc391511c5642eca57"

jobs:

  # ============================================================
  # 1. BUILD DARWIN SDK
  # ============================================================

  prepare-darwin-sdk:
    name: Prepare Darwin SDK
    runs-on: macos-15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show Xcode environment
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Archive iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "SDK_PATH=$SDK_PATH"
          echo "SDK_VERSION=$SDK_VERSION"

          mkdir -p "$RUNNER_TEMP/darwin-sdk"

          ditto \
            "$SDK_PATH" \
            "$RUNNER_TEMP/darwin-sdk/iPhoneOS.sdk"

          tar \
            -C "$RUNNER_TEMP/darwin-sdk" \
            -czf "$RUNNER_TEMP/DarwinSDK.tar.gz" \
            iPhoneOS.sdk

          sha256sum "$RUNNER_TEMP/DarwinSDK.tar.gz"

          echo "$SDK_VERSION" \
            > "$RUNNER_TEMP/DarwinSDK.version"

      - name: Upload Darwin SDK
        uses: actions/upload-artifact@v5
        with:
          name: darwin-sdk
          path: |
            ${{ runner.temp }}/DarwinSDK.tar.gz
            ${{ runner.temp }}/DarwinSDK.version
          retention-days: 7


  # ============================================================
  # 2. BUILD ANDROID 17 ACK 6.18 KERNEL
  # ============================================================

  #
  # IMPORTANT:
  #
  # Kernarium Android 17 producer requires:
  #
  #   Linux x86_64
  #   >= 64 GiB RAM
  #   >= 400 GiB free disk
  #
  # GitHub larger runner:
  #
  #   ubuntu-24.04-16core
  #
  # Expected:
  #
  #   16 vCPU
  #   64 GiB RAM
  #   600 GB SSD
  #
  # DO NOT change this to ubuntu-latest.
  #

  build-android17-kernel:
    name: Build Android 17 ACK Kernel

    runs-on: ubuntu-24.04-16core

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # Download Darwin SDK
      # --------------------------------------------------------

      - name: Download Darwin SDK
        uses: actions/download-artifact@v5
        with:
          name: darwin-sdk
          path: ${{ runner.temp }}/darwin-sdk


      # --------------------------------------------------------
      # Install Linux dependencies
      # --------------------------------------------------------

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            repo \
            rsync \
            unzip \
            zip \
            curl \
            wget \
            python3 \
            python3-pip \
            python3-venv \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            cpio \
            kmod \
            dwarves \
            pahole \
            device-tree-compiler \
            clang \
            lld \
            llvm \
            libncurses-dev

          echo
          echo "Tool versions:"
          git --version
          repo --version || true
          python3 --version
          clang --version | head -5
          ld.lld --version | head -5


      # --------------------------------------------------------
      # Configure Git
      # --------------------------------------------------------

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name \
            "AndroidEmu CI"

          git config --global user.email \
            "androidemu-ci@users.noreply.github.com"

          git config --global init.defaultBranch main


      # --------------------------------------------------------
      # Extract Darwin SDK
      # --------------------------------------------------------

      - name: Extract Darwin SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$RUNNER_TEMP/darwin-sdk/extracted"

          tar \
            -xzf "$RUNNER_TEMP/darwin-sdk/DarwinSDK.tar.gz" \
            -C "$RUNNER_TEMP/darwin-sdk/extracted"

          SDK="$RUNNER_TEMP/darwin-sdk/extracted/iPhoneOS.sdk"

          test -f "$SDK/SDKSettings.json"

          echo "DARWIN_SDK=$SDK" >> "$GITHUB_ENV"

          echo
          echo "Darwin SDK:"
          du -sh "$SDK"

          echo
          echo "SDK version:"
          cat "$RUNNER_TEMP/darwin-sdk/DarwinSDK.version"


      # --------------------------------------------------------
      # Verify runner capacity
      # --------------------------------------------------------

      - name: Verify runner capacity
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUNNER INFORMATION"
          echo "=========================================="

          echo
          echo "CPU:"
          nproc

          echo
          echo "MEMORY:"
          free -h

          echo
          echo "DISK:"
          df -h "$GITHUB_WORKSPACE"

          echo
          echo "=========================================="
          echo "KERNEL BUILD REQUIREMENTS"
          echo "=========================================="

          echo "RAM  : >= 64 GiB"
          echo "DISK : >= 400 GiB free"

          echo
          echo "=========================================="
          echo "CHECKING"
          echo "=========================================="

          RAM_KIB="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"

          FREE_KIB="$(
            df -Pk "$GITHUB_WORKSPACE" |
            awk 'NR==2 {print $4}'
          )"

          echo "RAM_KIB=$RAM_KIB"
          echo "FREE_KIB=$FREE_KIB"

          if [ "$RAM_KIB" -lt 67108864 ]; then
            echo "::error::Runner has less than 64 GiB RAM"
            exit 1
          fi

          if [ "$FREE_KIB" -lt 419430400 ]; then
            echo "::error::Runner has less than 400 GiB free disk"
            exit 1
          fi

          echo
          echo "Runner capacity OK."


      # --------------------------------------------------------
      # Verify Android 17 producer
      # --------------------------------------------------------

      - name: Verify Android 17 producer
        shell: bash
        run: |
          set -euo pipefail

          test -x \
            android/aosp-17/build/prepare-sources.sh

          test -x \
            android/aosp-17/build/preflight.sh

          test -x \
            android/aosp-17/build/build-kernel.sh

          test -x \
            android/aosp-17/tools/publish-kernel-artifact.py

          echo
          echo "Android 17 producer files:"
          ls -lh \
            android/aosp-17/build/prepare-sources.sh \
            android/aosp-17/build/preflight.sh \
            android/aosp-17/build/build-kernel.sh \
            android/aosp-17/tools/publish-kernel-artifact.py

          echo
          echo "prepare-sources.sh:"
          android/aosp-17/build/prepare-sources.sh --help

          echo
          echo "preflight.sh:"
          android/aosp-17/build/preflight.sh --help

          echo
          echo "build-kernel.sh:"
          android/aosp-17/build/build-kernel.sh --help

          echo
          echo "publish-kernel-artifact.py:"
          android/aosp-17/tools/publish-kernel-artifact.py --help


      # --------------------------------------------------------
      # Create source workspaces
      # --------------------------------------------------------

      - name: Create Android 17 source workspaces
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          mkdir -p \
            "$ROOT/.build/android17/aosp"

          mkdir -p \
            "$ROOT/.build/android17/ack"

          mkdir -p \
            "$ROOT/.build/android17/kernel"

          mkdir -p \
            "$ROOT/.build/android17/kernel-build"

          mkdir -p \
            "$ROOT/.build/android17/artifacts"

          echo "AOSP_SOURCE=$ROOT/.build/android17/aosp" \
            >> "$GITHUB_ENV"

          echo "ACK_WORKSPACE=$ROOT/.build/android17/ack" \
            >> "$GITHUB_ENV"

          echo "KERNEL_SOURCE=$ROOT/.build/android17/ack/common" \
            >> "$GITHUB_ENV"

          echo "KERNEL_BUILD=$ROOT/.build/android17/kernel-build" \
            >> "$GITHUB_ENV"

          echo "KERNEL_ARTIFACT_ROOT=$ROOT/.build/android17/artifacts" \
            >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # Initialize AOSP Repo
      # --------------------------------------------------------

      - name: Initialize AOSP Repo workspace
        shell: bash
        run: |
          set -euo pipefail

          source \
            android/aosp-17/metadata/aosp.env

          echo "AOSP manifest repository:"
          echo "$ANDROID17_MANIFEST_REPOSITORY"

          echo
          echo "AOSP manifest tag:"
          echo "$ANDROID17_MANIFEST_TAG"

          repo init \
            -u "$ANDROID17_MANIFEST_REPOSITORY" \
            -b "$ANDROID17_MANIFEST_TAG" \
            --manifest-depth=1 \
            --repo-rev=stable \
            --no-repo-verify \
            --no-clone-bundle \
            "$AOSP_SOURCE"


      # --------------------------------------------------------
      # Initialize ACK workspace
      # --------------------------------------------------------

      - name: Initialize ACK Repo workspace
        shell: bash
        run: |
          set -euo pipefail

          source \
            kernel/android-6.18/patches/metadata.env

          echo "ACK repository:"
          echo "$UML_KERNEL_UPSTREAM_REPOSITORY"

          echo
          echo "ACK branch:"
          echo "$UML_KERNEL_UPSTREAM_BRANCH"

          mkdir -p "$ACK_WORKSPACE"

          repo init \
            -u "$UML_KERNEL_UPSTREAM_REPOSITORY" \
            -b "$UML_KERNEL_UPSTREAM_BRANCH" \
            --repo-rev=stable \
            --no-repo-verify \
            --no-clone-bundle \
            "$ACK_WORKSPACE"


      # --------------------------------------------------------
      # Prepare Android 17 sources
      # --------------------------------------------------------

      - name: Prepare Android 17 sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          echo "Preparing Android 17 sources..."

          android/aosp-17/build/prepare-sources.sh \
            --aosp-source "$AOSP_SOURCE" \
            --ack-workspace "$ACK_WORKSPACE" \
            --jobs "$(nproc)"


      # --------------------------------------------------------
      # Source-only preflight
      # --------------------------------------------------------

      - name: Android 17 source preflight
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          echo "Running Android 17 source preflight..."

          android/aosp-17/build/preflight.sh \
            --aosp-source "$AOSP_SOURCE" \
            --ack-workspace "$ACK_WORKSPACE" \
            --source-only


      # --------------------------------------------------------
      # Build kernel
      # --------------------------------------------------------

      - name: Build Android 17 ACK kernel
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD ANDROID 17 ACK 6.18 KERNEL"
          echo "=========================================="

          echo
          echo "AOSP_SOURCE=$AOSP_SOURCE"
          echo "ACK_WORKSPACE=$ACK_WORKSPACE"
          echo "KERNEL_SOURCE=$KERNEL_SOURCE"
          echo "KERNEL_BUILD=$KERNEL_BUILD"
          echo "DARWIN_SDK=$DARWIN_SDK"

          android/aosp-17/build/build-kernel.sh \
            --ack-workspace "$ACK_WORKSPACE" \
            --kernel-source "$KERNEL_SOURCE" \
            --darwin-sdk "$DARWIN_SDK" \
            --build "$KERNEL_BUILD" \
            --jobs "$(nproc)"


      # --------------------------------------------------------
      # Publish kernel artifact
      # --------------------------------------------------------

      - name: Publish Android 17 kernel artifact
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          RELEASE_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Release ID:"
          echo "$RELEASE_ID"

          android/aosp-17/tools/publish-kernel-artifact.py \
            --source "$KERNEL_SOURCE" \
            --build "$KERNEL_BUILD" \
            --output-root "$KERNEL_ARTIFACT_ROOT" \
            --release-id "$RELEASE_ID"

          echo
          echo "Published kernel artifacts:"

          find "$KERNEL_ARTIFACT_ROOT" \
            -maxdepth 4 \
            -type f \
            -print


      # --------------------------------------------------------
      # Upload kernel artifact
      # --------------------------------------------------------

      - name: Upload Android 17 kernel artifact
        uses: actions/upload-artifact@v5
        with:
          name: android17-kernel
          path: |
            ${{ github.workspace }}/.build/android17/artifacts/**
          retention-days: 30


  # ============================================================
  # 3. BUILD KERNARIUM + IOS APP
  # ============================================================

  build-ios:
    name: Build AndroidEmu iOS

    needs:
      - prepare-darwin-sdk
      - build-android17-kernel

    runs-on: macos-15

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # Xcode
      # --------------------------------------------------------

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"


      # --------------------------------------------------------
      # Build dependencies
      # --------------------------------------------------------

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew update

          brew install \
            cmake \
            ninja \
            ccache \
            python3 \
            meson \
            pkg-config \
            autoconf \
            automake \
            libtool \
            gettext \
            gperf \
            groff \
            curl \
            wget \
            rsync


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Prepare Python environment
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv \
            "$RUNNER_TEMP/venv"

          "$RUNNER_TEMP/venv/bin/python" \
            -m pip install --upgrade pip

          "$RUNNER_TEMP/venv/bin/python" \
            -m pip install PyYAML

          echo \
            "$RUNNER_TEMP/venv/bin" \
            >> "$GITHUB_PATH"


      # --------------------------------------------------------
      # Git
      # --------------------------------------------------------

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail

          git config --global \
            user.name \
            "AndroidEmu CI"

          git config --global \
            user.email \
            "androidemu-ci@users.noreply.github.com"


      # --------------------------------------------------------
      # Darwin SDK
      # --------------------------------------------------------

      - name: Download Darwin SDK
        uses: actions/download-artifact@v5
        with:
          name: darwin-sdk
          path: ${{ runner.temp }}/darwin-sdk


      - name: Extract Darwin SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$RUNNER_TEMP/darwin-sdk/extracted"

          tar \
            -xzf "$RUNNER_TEMP/darwin-sdk/DarwinSDK.tar.gz" \
            -C "$RUNNER_TEMP/darwin-sdk/extracted"

          SDK="$RUNNER_TEMP/darwin-sdk/extracted/iPhoneOS.sdk"

          test -f "$SDK/SDKSettings.json"

          echo "DARWIN_SDK=$SDK" \
            >> "$GITHUB_ENV"

          echo
          echo "Darwin SDK:"
          du -sh "$SDK"


      # --------------------------------------------------------
      # Android 17 kernel artifact
      # --------------------------------------------------------

      - name: Download Android 17 kernel artifact
        uses: actions/download-artifact@v5
        with:
          name: android17-kernel
          path: ${{ github.workspace }}/.build/kernel/artifacts


      - name: Show Android 17 kernel artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID 17 KERNEL ARTIFACT"
          echo "=========================================="

          echo
          echo "Files:"

          find \
            "$GITHUB_WORKSPACE/.build/kernel/artifacts" \
            -maxdepth 6 \
            -type f \
            -print

          echo
          echo "Directories:"

          find \
            "$GITHUB_WORKSPACE/.build/kernel/artifacts" \
            -maxdepth 3 \
            -type d \
            -print


      # --------------------------------------------------------
      # Verify kernel artifact
      # --------------------------------------------------------

      - name: Verify Android 17 kernel artifact
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_ROOT="$GITHUB_WORKSPACE/.build/kernel/artifacts"

          test -d "$ARTIFACT_ROOT"

          KERNEL_DIR="$(
            find "$ARTIFACT_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name 'android-6.18-arm64-16k-*' \
              -print -quit
          )"

          if [ -z "$KERNEL_DIR" ]; then
            echo "::error::Android 17 kernel artifact directory was not found"
            exit 1
          fi

          echo
          echo "KERNEL_DIR=$KERNEL_DIR"

          test -f "$KERNEL_DIR/kernel/vmlinux"
          test -f "$KERNEL_DIR/kernel/System.map"
          test -f "$KERNEL_DIR/kernel/config"
          test -f "$KERNEL_DIR/kernel/kernel.release"
          test -f "$KERNEL_DIR/kernel/modules.builtin"
          test -f "$KERNEL_DIR/kernel/modules.builtin.modinfo"
          test -f "$KERNEL_DIR/kernel-artifact.json"

          echo \
            "KERNEL_ARTIFACT_DIR=$KERNEL_DIR" \
            >> "$GITHUB_ENV"

          echo
          echo "=========================================="
          echo "ANDROID 17 KERNEL METADATA"
          echo "=========================================="

          cat \
            "$KERNEL_DIR/kernel-artifact.json"


      # --------------------------------------------------------
      # Fetch Kernarium
      # --------------------------------------------------------

      - name: Fetch Kernarium
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$RUNNER_TEMP/Kernarium"

          git clone \
            --filter=blob:none \
            https://github.com/imxieyi/Kernarium.git \
            "$RUNNER_TEMP/Kernarium"

          git -C "$RUNNER_TEMP/Kernarium" fetch \
            --depth=1 \
            origin \
            "$KERNARIUM_COMMIT"

          git -C "$RUNNER_TEMP/Kernarium" checkout \
            --detach \
            "$KERNARIUM_COMMIT"

          ACTUAL="$(
            git -C "$RUNNER_TEMP/Kernarium" \
              rev-parse HEAD
          )"

          echo "Expected:"
          echo "$KERNARIUM_COMMIT"

          echo
          echo "Actual:"
          echo "$ACTUAL"

          test "$ACTUAL" = "$KERNARIUM_COMMIT"

          echo \
            "KERNARIUM_ROOT=$RUNNER_TEMP/Kernarium" \
            >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # Verify Android 17 product
      # --------------------------------------------------------

      - name: Verify Android 17 product
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNARIUM_ROOT"

          test -f \
            android/aosp-17/CMakeLists.txt

          test -f \
            android/aosp-17/README.md

          test -f \
            kernel/android-6.18/artifacts/accepted-16k.env

          echo
          echo "Android 17 product:"
          echo "OK"

          echo
          echo "Accepted kernel artifact metadata:"

          cat \
            kernel/android-6.18/artifacts/accepted-16k.env


      # --------------------------------------------------------
      # Patch Kernarium
      # --------------------------------------------------------

      - name: Patch Kernarium for iOS 16.4
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          scripts/patch-kernarium.sh \
            "$KERNARIUM_ROOT" \
            "$IOS_VERSION"


      # --------------------------------------------------------
      # Build Kernarium
      # --------------------------------------------------------

      - name: Build Kernarium
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          KERNEL_ARTIFACT_DIR: ${{ github.workspace }}/.build/kernel/artifacts
        run: |
          set -euo pipefail

          test -d "$KERNEL_ARTIFACT_DIR"

          echo "=========================================="
          echo "BUILD KERNARIUM"
          echo "=========================================="

          echo
          echo "KERNEL_ARTIFACT_DIR:"
          echo "$KERNEL_ARTIFACT_DIR"

          scripts/build-kernarium.sh


      # --------------------------------------------------------
      # Verify Kernarium
      # --------------------------------------------------------

      - name: Verify Kernarium output
        shell: bash
        run: |
          set -euo pipefail

          test -d "$KERNARIUM_ROOT"

          echo
          echo "=========================================="
          echo "KERNARIUM BUILD OUTPUT"
          echo "=========================================="

          find "$KERNARIUM_ROOT/.build" \
            -maxdepth 6 \
            -type f \
            \( \
              -name '*.a' \
              -o -name '*.dylib' \
              -o -name '*.app' \
            \) \
            -print | head -300


      # --------------------------------------------------------
      # Stage Android runtime
      # --------------------------------------------------------

      - name: Stage Android runtime
        shell: bash
        run: |
          set -euo pipefail

          scripts/stage-android.sh \
            "$KERNARIUM_ROOT"


      # --------------------------------------------------------
      # Verify Android runtime
      # --------------------------------------------------------

      - name: Verify staged Android runtime
        shell: bash
        run: |
          set -euo pipefail

          test -d "$KERNARIUM_ROOT"

          echo
          echo "=========================================="
          echo "ANDROID RUNTIME STAGING"
          echo "=========================================="

          find "$KERNARIUM_ROOT" \
            -maxdepth 7 \
            -type f \
            -print | head -500


      # --------------------------------------------------------
      # Verify Xcode project
      # --------------------------------------------------------

      - name: Verify Xcode project
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            AndroidEmu.xcodeproj/project.pbxproj


      # --------------------------------------------------------
      # Build iOS app
      # --------------------------------------------------------

      - name: Build AndroidEmu.app
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD ANDROIDEMU.APP"
          echo "=========================================="

          xcodebuild \
            -project AndroidEmu.xcodeproj \
            -scheme AndroidEmu \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build


      # --------------------------------------------------------
      # Locate app
      # --------------------------------------------------------

      - name: Locate AndroidEmu.app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(
            find "$GITHUB_WORKSPACE" \
              -type d \
              -path '*/Build/Products/Release-iphoneos/AndroidEmu.app' \
              -print -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "::error::AndroidEmu.app was not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" \
            >> "$GITHUB_ENV"

          echo
          echo "AndroidEmu.app:"
          echo "$APP_PATH"

          echo
          du -sh "$APP_PATH"


      # --------------------------------------------------------
      # Package IPA
      # --------------------------------------------------------

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$RUNNER_TEMP/Payload"

          mkdir -p \
            "$RUNNER_TEMP/Payload"

          cp -R \
            "$APP_PATH" \
            "$RUNNER_TEMP/Payload/AndroidEmu.app"

          cd "$RUNNER_TEMP"

          /usr/bin/zip \
            -qry \
            "$GITHUB_WORKSPACE/AndroidEmu-iOS16.4.ipa" \
            Payload


      # --------------------------------------------------------
      # Verify IPA
      # --------------------------------------------------------

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/AndroidEmu-iOS16.4.ipa"

          test -f "$IPA"

          echo
          echo "=========================================="
          echo "IPA CONTENT"
          echo "=========================================="

          unzip -l "$IPA"

          echo
          echo "=========================================="
          echo "IPA SIZE"
          echo "=========================================="

          du -h "$IPA"


      # --------------------------------------------------------
      # Upload IPA
      # --------------------------------------------------------

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: AndroidEmu-iOS16.4
          path: AndroidEmu-iOS16.4.ipa
          retention-days: 30
