name: AndroidEmu iOS 16.4

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IOS_VERSION: "16.4"
  KERNARIUM_COMMIT: "2c49df8ccb7b138400548ccc391511c5642eca57"

jobs:
  build:
    runs-on: macos-15

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Select Xcode 16.4
      # ==========================================================
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

          echo "Xcode:"
          xcodebuild -version

          echo
          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-path

      # ==========================================================
      # Install all Kernarium build dependencies
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -euo pipefail

          brew update

          brew install \
            cmake \
            ninja \
            ccache \
            python3 \
            meson \
            pkg-config \
            autoconf \
            automake \
            libtool \
            gettext \
            gperf

          echo
          echo "Installed tools:"
          echo

          cmake --version
          ninja --version
          meson --version
          pkg-config --version
          python3 --version
          clang --version

          echo
          echo "Autotools:"
          autoreconf --version
          autoconf --version
          automake --version

          echo
          echo "Libtool:"
          glibtoolize --version || libtoolize --version

          echo
          echo "gettext:"
          autopoint --version

          echo
          echo "gperf:"
          gperf --version

      # ==========================================================
      # Python environment
      # ==========================================================
      - name: Prepare Python build environment
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/kernarium-venv"

          source "$RUNNER_TEMP/kernarium-venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install PyYAML

          echo
          echo "Python:"
          python --version

          echo
          echo "PyYAML:"
          python -c "import yaml; print(yaml.__version__)"

      # ==========================================================
      # Fetch Kernarium
      # ==========================================================
      - name: Fetch Kernarium
        run: |
          chmod +x scripts/fetch-kernarium.sh
          scripts/fetch-kernarium.sh

      # ==========================================================
      # Patch Kernarium for iOS 16.4
      # ==========================================================
      - name: Patch Kernarium for iOS 16.4
        run: |
          chmod +x scripts/patch-ios16.sh
          scripts/patch-ios16.sh "$GITHUB_WORKSPACE/Kernarium"

      # ==========================================================
      # Build Kernarium
      # ==========================================================
      - name: Build Kernarium
        run: |
          chmod +x scripts/build-kernarium.sh
          scripts/build-kernarium.sh

      # ==========================================================
      # Stage Android runtime
      # ==========================================================
      - name: Stage Android runtime
        run: |
          chmod +x scripts/stage-android.sh
          scripts/stage-android.sh

      # ==========================================================
      # Build iOS application
      # ==========================================================
      - name: Build AndroidEmu.app
        run: |
          set -euo pipefail

          APP_DIR="$GITHUB_WORKSPACE/App"
          PROJECT="$APP_DIR/AndroidEmu.xcodeproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Xcode project not found:"
            echo "$PROJECT"
            exit 1
          fi

          source "$RUNNER_TEMP/kernarium-venv/bin/activate"

          xcodebuild \
            -project "$PROJECT" \
            -scheme AndroidEmu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=16.4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      # ==========================================================
      # Package IPA
      # ==========================================================
      - name: Package IPA
        run: |
          chmod +x scripts/package-ipa.sh
          scripts/package-ipa.sh

      # ==========================================================
      # Upload IPA
      # ==========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AndroidEmu-iOS16.4
          path: AndroidEmu-iOS16.4.ipa
          if-no-files-found: error
