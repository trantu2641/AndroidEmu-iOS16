name: AndroidEmu iOS 16.4

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IOS_VERSION: "16.4"
  KERNARIUM_COMMIT: "2c49df8ccb7b138400548ccc391511c5642eca57"

jobs:

  # ============================================================
  # 1. BUILD DARWIN SDK
  # ============================================================
  prepare-darwin-sdk:
    name: Prepare Darwin SDK
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show Xcode environment
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Archive iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "SDK_PATH=$SDK_PATH"
          echo "SDK_VERSION=$SDK_VERSION"

          mkdir -p "$RUNNER_TEMP/darwin-sdk"

          ditto "$SDK_PATH" \
            "$RUNNER_TEMP/darwin-sdk/iPhoneOS.sdk"

          tar \
            -C "$RUNNER_TEMP/darwin-sdk" \
            -czf "$RUNNER_TEMP/DarwinSDK.tar.gz" \
            iPhoneOS.sdk

          sha256sum "$RUNNER_TEMP/DarwinSDK.tar.gz"

          echo "$SDK_VERSION" \
            > "$RUNNER_TEMP/DarwinSDK.version"

      - name: Upload Darwin SDK
        uses: actions/upload-artifact@v4
        with:
          name: darwin-sdk
          path: |
            ${{ runner.temp }}/DarwinSDK.tar.gz
            ${{ runner.temp }}/DarwinSDK.version
          retention-days: 7


  # ============================================================
  # 2. BUILD ANDROID 17 ACK 6.18 KERNEL
  # ============================================================
  #
  # IMPORTANT:
  # Kernarium's Android 17 producer requires:
  #   Linux x86_64
  #   >= 64 GiB RAM
  #   >= 400 GiB free workspace
  #
  # Therefore DO NOT replace this with ubuntu-latest.
  #
  # If this runner is unavailable on your GitHub account,
  # this job will remain queued and must be moved to a
  # self-hosted / larger Linux runner with the required resources.
  #
  build-android17-kernel:
    name: Build Android 17 ACK Kernel
    runs-on: ubuntu-24.04-64-core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Darwin SDK
        uses: actions/download-artifact@v4
        with:
          name: darwin-sdk
          path: ${{ runner.temp }}/darwin-sdk

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            repo \
            rsync \
            unzip \
            zip \
            curl \
            wget \
            python3 \
            python3-pip \
            python3-venv \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            cpio \
            kmod \
            dwarves \
            pahole \
            device-tree-compiler \
            clang \
            lld \
            llvm \
            libncurses-dev

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "AndroidEmu CI"
          git config --global user.email "androidemu-ci@users.noreply.github.com"

      - name: Extract Darwin SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/darwin-sdk/extracted"

          tar \
            -xzf "$RUNNER_TEMP/darwin-sdk/DarwinSDK.tar.gz" \
            -C "$RUNNER_TEMP/darwin-sdk/extracted"

          SDK="$RUNNER_TEMP/darwin-sdk/extracted/iPhoneOS.sdk"

          test -f "$SDK/SDKSettings.json"

          echo "DARWIN_SDK=$SDK" >> "$GITHUB_ENV"

          echo "Darwin SDK:"
          du -sh "$SDK"
          cat "$RUNNER_TEMP/darwin-sdk/DarwinSDK.version"

      - name: Verify runner capacity
        shell: bash
        run: |
          set -euo pipefail

          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "Disk:"
          df -h "$GITHUB_WORKSPACE"

          echo
          echo "Required:"
          echo "  RAM >= 64 GiB"
          echo "  Free disk >= 400 GiB"

          RAM_KIB="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          FREE_KIB="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"

          if [ "$RAM_KIB" -lt 67108864 ]; then
            echo "::error::Runner has less than 64 GiB RAM"
            exit 1
          fi

          if [ "$FREE_KIB" -lt 419430400 ]; then
            echo "::error::Runner has less than 400 GiB free disk"
            exit 1
          fi

      - name: Verify Android 17 producer
        shell: bash
        run: |
          set -euo pipefail

          test -x android/aosp-17/build/prepare-sources.sh
          test -x android/aosp-17/build/preflight.sh
          test -x android/aosp-17/build/build-kernel.sh
          test -x android/aosp-17/tools/publish-kernel-artifact.py

          android/aosp-17/build/prepare-sources.sh --help
          android/aosp-17/build/preflight.sh --help
          android/aosp-17/build/build-kernel.sh --help
          android/aosp-17/tools/publish-kernel-artifact.py --help

      - name: Create Android 17 source workspaces
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          mkdir -p "$ROOT/.build/android17"
          mkdir -p "$ROOT/.build/android17/aosp"
          mkdir -p "$ROOT/.build/android17/ack"
          mkdir -p "$ROOT/.build/android17/kernel"
          mkdir -p "$ROOT/.build/android17/kernel-build"
          mkdir -p "$ROOT/.build/android17/artifacts"

          echo "AOSP_SOURCE=$ROOT/.build/android17/aosp" >> "$GITHUB_ENV"
          echo "ACK_WORKSPACE=$ROOT/.build/android17/ack" >> "$GITHUB_ENV"
          echo "KERNEL_SOURCE=$ROOT/.build/android17/ack/common" >> "$GITHUB_ENV"
          echo "KERNEL_BUILD=$ROOT/.build/android17/kernel-build" >> "$GITHUB_ENV"
          echo "KERNEL_ARTIFACT_ROOT=$ROOT/.build/android17/artifacts" >> "$GITHUB_ENV"

      - name: Initialize AOSP Repo workspace
        shell: bash
        run: |
          set -euo pipefail

          source android/aosp-17/metadata/aosp.env

          repo init \
            -u "$ANDROID17_MANIFEST_REPOSITORY" \
            -b "$ANDROID17_MANIFEST_TAG" \
            --manifest-depth=1 \
            --repo-rev=stable \
            --no-repo-verify \
            --no-clone-bundle \
            "$AOSP_SOURCE"

      - name: Initialize ACK Repo workspace
        shell: bash
        run: |
          set -euo pipefail

          source kernel/android-6.18/patches/metadata.env

          mkdir -p "$ACK_WORKSPACE"

          repo init \
            -u "$UML_KERNEL_UPSTREAM_REPOSITORY" \
            -b "$UML_KERNEL_UPSTREAM_BRANCH" \
            --repo-rev=stable \
            --no-repo-verify \
            --no-clone-bundle \
            "$ACK_WORKSPACE"

      - name: Prepare Android 17 sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          android/aosp-17/build/prepare-sources.sh \
            --aosp-source "$AOSP_SOURCE" \
            --ack-workspace "$ACK_WORKSPACE" \
            --jobs "$(nproc)"

      - name: Android 17 source preflight
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          android/aosp-17/build/preflight.sh \
            --aosp-source "$AOSP_SOURCE" \
            --ack-workspace "$ACK_WORKSPACE" \
            --source-only

      - name: Build Android 17 ACK kernel
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          android/aosp-17/build/build-kernel.sh \
            --ack-workspace "$ACK_WORKSPACE" \
            --kernel-source "$KERNEL_SOURCE" \
            --darwin-sdk "$DARWIN_SDK" \
            --build "$KERNEL_BUILD" \
            --jobs "$(nproc)"

      - name: Publish Android 17 kernel artifact
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          RELEASE_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          android/aosp-17/tools/publish-kernel-artifact.py \
            --source "$KERNEL_SOURCE" \
            --build "$KERNEL_BUILD" \
            --output-root "$KERNEL_ARTIFACT_ROOT" \
            --release-id "$RELEASE_ID"

          find "$KERNEL_ARTIFACT_ROOT" \
            -maxdepth 3 \
            -type f \
            -print

      - name: Upload Android 17 kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: android17-kernel
          path: |
            ${{ github.workspace }}/.build/android17/artifacts/**
          retention-days: 30


  # ============================================================
  # 3. BUILD KERNARIUM + IOS APP
  # ============================================================
  build-ios:
    name: Build AndroidEmu iOS
    needs:
      - prepare-darwin-sdk
      - build-android17-kernel

    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew update

          brew install \
            cmake \
            ninja \
            ccache \
            python3 \
            meson \
            pkg-config \
            autoconf \
            automake \
            libtool \
            gettext \
            gperf \
            groff \
            curl \
            wget \
            rsync

      - name: Prepare Python environment
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/venv"

          "$RUNNER_TEMP/venv/bin/python" -m pip install \
            --upgrade pip

          "$RUNNER_TEMP/venv/bin/python" -m pip install \
            PyYAML

          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "AndroidEmu CI"
          git config --global user.email "androidemu-ci@users.noreply.github.com"

      - name: Download Darwin SDK
        uses: actions/download-artifact@v4
        with:
          name: darwin-sdk
          path: ${{ runner.temp }}/darwin-sdk

      - name: Extract Darwin SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/darwin-sdk/extracted"

          tar \
            -xzf "$RUNNER_TEMP/darwin-sdk/DarwinSDK.tar.gz" \
            -C "$RUNNER_TEMP/darwin-sdk/extracted"

          SDK="$RUNNER_TEMP/darwin-sdk/extracted/iPhoneOS.sdk"

          test -f "$SDK/SDKSettings.json"

          echo "DARWIN_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Download Android 17 kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: android17-kernel
          path: ${{ github.workspace }}/.build/kernel/artifacts

      - name: Show Android 17 kernel artifact
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE/.build/kernel/artifacts" \
            -maxdepth 5 \
            -type f \
            -print

          find "$GITHUB_WORKSPACE/.build/kernel/artifacts" \
            -maxdepth 2 \
            -type d \
            -print

      - name: Verify Android 17 kernel artifact
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_ROOT="$GITHUB_WORKSPACE/.build/kernel/artifacts"

          test -d "$ARTIFACT_ROOT"

          KERNEL_DIR="$(find "$ARTIFACT_ROOT" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name 'android-6.18-arm64-16k-*' \
            -print -quit)"

          if [ -z "$KERNEL_DIR" ]; then
            echo "::error::Android 17 kernel artifact directory was not found"
            exit 1
          fi

          test -f "$KERNEL_DIR/kernel/vmlinux"
          test -f "$KERNEL_DIR/kernel/System.map"
          test -f "$KERNEL_DIR/kernel/config"
          test -f "$KERNEL_DIR/kernel/kernel.release"
          test -f "$KERNEL_DIR/kernel/modules.builtin"
          test -f "$KERNEL_DIR/kernel/modules.builtin.modinfo"
          test -f "$KERNEL_DIR/kernel-artifact.json"

          echo "KERNEL_ARTIFACT_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

          echo
          echo "Android 17 kernel artifact:"
          cat "$KERNEL_DIR/kernel-artifact.json"

      - name: Fetch Kernarium
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/Kernarium"

          git clone \
            --filter=blob:none \
            https://github.com/imxieyi/Kernarium.git \
            "$RUNNER_TEMP/Kernarium"

          git -C "$RUNNER_TEMP/Kernarium" fetch \
            --depth=1 \
            origin "$KERNARIUM_COMMIT"

          git -C "$RUNNER_TEMP/Kernarium" checkout \
            --detach "$KERNARIUM_COMMIT"

          ACTUAL="$(git -C "$RUNNER_TEMP/Kernarium" rev-parse HEAD)"

          test "$ACTUAL" = "$KERNARIUM_COMMIT"

          echo "KERNARIUM_ROOT=$RUNNER_TEMP/Kernarium" >> "$GITHUB_ENV"

      - name: Verify Android 17 product
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNARIUM_ROOT"

          test -f android/aosp-17/CMakeLists.txt
          test -f android/aosp-17/README.md
          test -f kernel/android-6.18/artifacts/accepted-16k.env

      - name: Patch Kernarium for iOS 16.4
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          scripts/patch-kernarium.sh "$KERNARIUM_ROOT" "$IOS_VERSION"

      - name: Build Kernarium
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          KERNEL_ARTIFACT_DIR: ${{ github.workspace }}/.build/kernel/artifacts
        run: |
          set -euo pipefail

          test -d "$KERNEL_ARTIFACT_DIR"

          scripts/build-kernarium.sh

      - name: Verify Kernarium output
        shell: bash
        run: |
          set -euo pipefail

          test -d "$KERNARIUM_ROOT"

          echo "Kernarium build output:"
          find "$KERNARIUM_ROOT/.build" \
            -maxdepth 5 \
            -type f \
            \( -name '*.a' -o -name '*.dylib' -o -name '*.app' \) \
            -print | head -200

      - name: Stage Android runtime
        shell: bash
        run: |
          set -euo pipefail

          scripts/stage-android.sh "$KERNARIUM_ROOT"

      - name: Verify staged Android runtime
        shell: bash
        run: |
          set -euo pipefail

          test -d "$KERNARIUM_ROOT"

          echo "Android runtime staging:"
          find "$KERNARIUM_ROOT" \
            -maxdepth 5 \
            -type f \
            -print | head -300

      - name: Verify Xcode project
        shell: bash
        run: |
          set -euo pipefail

          test -f AndroidEmu.xcodeproj/project.pbxproj

      - name: Build AndroidEmu.app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project AndroidEmu.xcodeproj \
            -scheme AndroidEmu \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate AndroidEmu.app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE" \
            -type d \
            -path '*/Build/Products/Release-iphoneos/AndroidEmu.app' \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::AndroidEmu.app was not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" \
            "$RUNNER_TEMP/Payload/AndroidEmu.app"

          cd "$RUNNER_TEMP"

          /usr/bin/zip \
            -qry \
            "$GITHUB_WORKSPACE/AndroidEmu-iOS16.4.ipa" \
            Payload

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GITHUB_WORKSPACE/AndroidEmu-iOS16.4.ipa"

          unzip -l \
            "$GITHUB_WORKSPACE/AndroidEmu-iOS16.4.ipa"

          echo
          echo "IPA size:"
          du -h "$GITHUB_WORKSPACE/AndroidEmu-iOS16.4.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AndroidEmu-iOS16.4
          path: AndroidEmu-iOS16.4.ipa
          retention-days: 30
