name: AndroidEmu iOS 16.4

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IOS_VERSION: "16.4"
  KERNARIUM_COMMIT: "2c49df8ccb7b138400548ccc391511c5642eca57"

jobs:
  build:
    runs-on: macos-15

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Select Xcode 16.4
      # ==========================================================
      - name: Select Xcode 16.4
        run: |
          set -euo pipefail

          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

          echo "Xcode:"
          xcodebuild -version || true

          echo
          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-path

      # ==========================================================
      # Install all Kernarium build dependencies
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -euo pipefail

          brew update

          brew install \
            cmake \
            ninja \
            ccache \
            python3 \
            meson \
            pkg-config \
            autoconf \
            automake \
            libtool \
            gettext \
            gperf \
            groff

          echo
          echo "Installed tools:"
          echo

          cmake --version
          ninja --version
          meson --version
          pkg-config --version
          python3 --version
          clang --version

          echo
          echo "Autotools:"
          autoreconf --version
          autoconf --version
          automake --version

          echo
          echo "Libtool:"
          glibtoolize --version || libtoolize --version

          echo
          echo "gettext:"
          autopoint --version

          echo
          echo "gperf:"
          gperf --version

          echo
          echo "groff:"
          groff --version

      # ==========================================================
      # Python environment
      # ==========================================================
      - name: Prepare Python build environment
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/kernarium-venv"

          source "$RUNNER_TEMP/kernarium-venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install PyYAML

          echo
          echo "Python:"
          python --version

          echo
          echo "PyYAML:"
          python -c "import yaml; print(yaml.__version__)"

      # ==========================================================
      # Configure Git identity
      # Kernarium dependency preparation requires Git identity.
      # ==========================================================
      - name: Configure Git identity
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git identity:"
          git config --global user.name
          git config --global user.email

      # ==========================================================
      # Fetch Kernarium
      # ==========================================================
      - name: Fetch Kernarium
        run: |
          set -euo pipefail

          chmod +x scripts/fetch-kernarium.sh
          scripts/fetch-kernarium.sh

          echo
          echo "Kernarium commit:"
          git -C "$GITHUB_WORKSPACE/Kernarium" rev-parse HEAD

      # ==========================================================
      # Verify AOSP 17 source
      # ==========================================================
      - name: Verify Kernarium Android source
        run: |
          set -euo pipefail

          KERNARIUM="$GITHUB_WORKSPACE/Kernarium"

          if [ ! -d "$KERNARIUM/android/aosp-17" ]; then
            echo "ERROR: Kernarium Android AOSP 17 source not found:"
            echo "$KERNARIUM/android/aosp-17"
            exit 1
          fi

          echo "AOSP 17 source:"
          du -sh "$KERNARIUM/android/aosp-17"

          echo
          echo "AOSP 17 contents:"
          find "$KERNARIUM/android/aosp-17" -maxdepth 1 -mindepth 1 -print | sort

      # ==========================================================
      # Patch Kernarium for iOS 16.4
      # ==========================================================
      - name: Patch Kernarium for iOS 16.4
        run: |
          set -euo pipefail

          chmod +x scripts/patch-ios16.sh
          scripts/patch-ios16.sh "$GITHUB_WORKSPACE/Kernarium"

      # ==========================================================
      # Build Kernarium
      # ==========================================================
      - name: Build Kernarium
        run: |
          set -euo pipefail

          chmod +x scripts/build-kernarium.sh

          export IOS_VERSION="16.4"
          export KERNARIUM_COMMIT="2c49df8ccb7b138400548ccc391511c5642eca57"

          scripts/build-kernarium.sh

      # ==========================================================
      # Stage Android runtime
      # ==========================================================
      - name: Stage Android runtime
        run: |
          set -euo pipefail

          chmod +x scripts/stage-android.sh
          scripts/stage-android.sh

      # ==========================================================
      # Verify staged Android runtime
      # ==========================================================
      - name: Verify staged Android runtime
        run: |
          set -euo pipefail

          APP_ANDROID="$GITHUB_WORKSPACE/App/AndroidEmu/Resources/Android"

          if [ ! -d "$APP_ANDROID" ]; then
            echo "ERROR: Android runtime directory does not exist:"
            echo "$APP_ANDROID"
            exit 1
          fi

          echo "Android runtime directory:"
          echo "$APP_ANDROID"

          echo
          echo "Contents:"
          find "$APP_ANDROID" -maxdepth 3 -type f -print | sort | head -200

      # ==========================================================
      # Build iOS application
      # ==========================================================
      - name: Build AndroidEmu.app
        run: |
          set -euo pipefail

          APP_DIR="$GITHUB_WORKSPACE/App"
          PROJECT="$APP_DIR/AndroidEmu.xcodeproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Xcode project not found:"
            echo "$PROJECT"
            exit 1
          fi

          source "$RUNNER_TEMP/kernarium-venv/bin/activate"

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo
          echo "Using:"
          echo "  Project: $PROJECT"
          echo "  SDK: $SDK_PATH"
          echo "  Deployment target: 16.4"

          xcodebuild \
            -project "$PROJECT" \
            -scheme AndroidEmu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=16.4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      # ==========================================================
      # Verify AndroidEmu.app
      # ==========================================================
      - name: Verify AndroidEmu.app
        run: |
          set -euo pipefail

          APP="$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -path "*/Build/Products/Release-iphoneos/AndroidEmu.app" \
            -print \
            -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: AndroidEmu.app was not produced."
            exit 1
          fi

          echo
          echo "AndroidEmu.app:"
          echo "$APP"

          echo
          echo "App size:"
          du -sh "$APP"

          echo
          echo "App contents:"
          find "$APP" -maxdepth 2 -type f -print | sort | head -200

      # ==========================================================
      # Package IPA
      # ==========================================================
      - name: Package IPA
        run: |
          set -euo pipefail

          chmod +x scripts/package-ipa.sh
          scripts/package-ipa.sh

      # ==========================================================
      # Verify IPA
      # ==========================================================
      - name: Verify IPA
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/AndroidEmu-iOS16.4.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA was not created:"
            echo "$IPA"
            exit 1
          fi

          echo
          echo "IPA:"
          ls -lh "$IPA"

          echo
          echo "IPA contents:"
          unzip -l "$IPA" | head -100

      # ==========================================================
      # Upload IPA
      # ==========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AndroidEmu-iOS16.4
          path: AndroidEmu-iOS16.4.ipa
          if-no-files-found: error
